name: skip ci

# Builds the skip plugin package at the repository root with the `skip` tool compiled from the
# skipstone/ sub-folder (SKIPLOCAL), and runs the SkipDrive and SkipTest test suites, which
# create and build real Skip projects with that tool. The skipstone package's own test suite
# and the emulator tests run in the "skipstone CI" workflow (skipstone-ci.yml).

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0,4,8,12,16,18 * * *'
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skip-ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          # fails with error redefinition of module 'ELFKitC'
          #- os: 'macos-15-intel'
          #  xcode: '16.4'

          - os: 'macos-26'
            xcode: '26.0'

          - os: 'ubuntu-24.04'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
          add-job-summary: never

      - name: Checkout skip
        uses: actions/checkout@v6
        with:
          # need to fetch tags so we know the most recent version
          fetch-tags: true

      - name: Setup Xcode
        if: ${{ startsWith(matrix.os, 'macos-') }}
        run: |
          # set only on macOS: on Linux the empty Xcode path makes Swift Build fail to load toolchains
          export DEVELOPER_DIR=/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}" >> $GITHUB_ENV

          # workaround for failure to find iOS 26 simulator
          # https://github.com/actions/runner-images/issues/12862#issuecomment-3239326872
          xcrun simctl list || true

          # alternatively https://github.com/actions/runner-images/issues/12904#issuecomment-3245474273
          xcodebuild -downloadPlatform iOS || true

      - name: Setup SKIPLOCAL
        run: |
          # build the skip tool from the skipstone/ sources rather than downloading the released binary
          echo "SKIPLOCAL=$PWD/skipstone" >> $GITHUB_ENV
          # make projects created by the tests transpile with the skipstone built above, not the released plugin binary
          echo "SKIP_COMMAND_OVERRIDE=$PWD/.build/debug/skip" >> $GITHUB_ENV
          echo "PATH=$PWD/.build/plugins/tools/debug:$PWD/.build/debug:$PATH" >> $GITHUB_ENV

      - name: Build Skip
        run: swift build

      - name: Test Skip
        run: swift test
