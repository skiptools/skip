name: skip release

# Builds the `skip` tool from skipstone/ for macOS (universal) and Linux (static) and runs the
# release script. Every push and the nightly schedule perform a dry run, which builds the
# artifacts and shows the changes a release would make without committing anything.
#
# An actual release is made by dispatching this workflow manually with "dry run" unchecked.
# It bumps the version, commits, tags, pushes, and publishes the artifacts to this repository's
# GitHub releases. If a RELEASE_TOKEN secret with write access to the ${owner}/homebrew-skip
# repository is present, the Homebrew cask is updated as well; otherwise that step is skipped.
#
# A fork can rehearse the whole process: the release is made against the fork's own GitHub
# repository and releases, and the binary target URLs written to Package.swift point at it.

on:
  push:
    #branches: [ main ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build the release artifacts but do not commit, tag, push, or publish'
        type: boolean
        default: true
      bump:
        description: 'The semantic version component to bump'
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major
      ignore_ci:
        description: 'Release even if CI has not passed for this commit'
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  skip-release:
    runs-on: macos-26
    env:
      # the release script uses the gh command to check CI, create the release, and upload the artifacts
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      # secrets cannot be tested in a step's `if`, so expose whether the cross-repo token is configured
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
    steps:
      - name: Checkout skip
        uses: actions/checkout@v6
        with:
          # need to fetch tags so we know the most recent version
          fetch-tags: true
          # needed or else trigger from tag will fail
          # https://github.com/actions/checkout/issues/1467
          ref: ${{ github.ref }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Checkout homebrew-skip
        # a fork without a homebrew-skip fork (or without a RELEASE_TOKEN to push to it) just skips the cask update
        if: env.HAS_RELEASE_TOKEN == 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/homebrew-skip
          path: homebrew-skip
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure git identity
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Install Dependencies
        run: |
          brew install tree swiftly
          swiftly init --assume-yes --no-modify-profile --skip-install

      - name: Setup Static Linux SDK
        run: |
          SWIFT_VERSION=6.4.1
          swiftly install --use ${SWIFT_VERSION}

          curl -fsSL -o swift-static-linux-sdk.tar.gz https://download.swift.org/swift-${SWIFT_VERSION}-release/static-sdk/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz
          swift sdk install swift-static-linux-sdk.tar.gz
          swift sdk list

          # this version will be used by the release script for
          # building the static Linux version
          echo "SWIFT_VERSION=${SWIFT_VERSION}" >> $GITHUB_ENV

      - name: Build Skip Release
        run: ./skipstone/scripts/release_skip.sh
        env:
          # only a manual dispatch with "dry run" unchecked performs a release
          DRY_RUN: ${{ (github.event_name != 'workflow_dispatch' || inputs.dry_run) && '1' || '0' }}
          SEMVER_BUMP: ${{ inputs.bump || 'patch' }}
          SKIP_RELEASE_IGNORE_CI: ${{ inputs.ignore_ci && '1' || '0' }}
          # release to the repository running the workflow, so a fork releases to itself
          SKIP_GITHUB_REPO: ${{ github.repository }}
          SKIPBREWDIR: ${{ github.workspace }}/homebrew-skip
